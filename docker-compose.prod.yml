# =============================================================
# docker-compose de PRODUCCIÓN.
#
# Diferencias clave contra docker-compose.yml (desarrollo):
#   - Nada de bind mounts: el código vive DENTRO de cada imagen
#     (Dockerfile.prod construye todo en build time).
#   - Los Vite dev servers (frontend/storefront/landing) se
#     reemplazan por builds estáticos servidos por nginx.
#   - Solo el servicio "nginx" (el reverse-proxy público) expone
#     puertos al host (80/443). Todo lo demás — backend, postgres,
#     redis, los 3 frontends — vive únicamente en la red interna
#     "colmerzia", inalcanzable desde fuera del servidor.
#   - Se agregan queue-worker y scheduler (Laravel ya tiene Jobs
#     reales: GenerateProductImagesJob, SendWelcomeEmailJob).
#
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# =============================================================

services:

  postgres:
    image: postgres:17
    container_name: colmerzia_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - colmerzia


  redis:
    image: redis:7-alpine
    container_name: colmerzia_redis
    restart: unless-stopped

    volumes:
      - redis_data:/data

    networks:
      - colmerzia


  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: app

    container_name: colmerzia_backend
    restart: unless-stopped

    env_file: .env.production

    volumes:
      # Único volumen que SÍ persiste en producción: los archivos
      # subidos (logos, etc. — ver Storage::disk('public')). Todo
      # lo demás del código ya está horneado en la imagen.
      - backend_storage:/var/www/html/storage/app/public

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - colmerzia


  backend-web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: web

    container_name: colmerzia_backend_web
    restart: unless-stopped

    volumes:
      # Mismo path que usa "backend" (storage/app/public), NO
      # public/storage — ver el comentario en backend.nginx.conf
      # sobre por qué no usamos el symlink de storage:link acá.
      - backend_storage:/var/www/html/storage/app/public:ro

    depends_on:
      - backend

    networks:
      - colmerzia


  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: app

    container_name: colmerzia_queue_worker
    restart: unless-stopped

    env_file: .env.production

    volumes:
      - backend_storage:/var/www/html/storage/app/public

    command: php artisan queue:work --tries=3 --backoff=30 --sleep=3

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - colmerzia


  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: app

    container_name: colmerzia_scheduler
    restart: unless-stopped

    env_file: .env.production

    volumes:
      - backend_storage:/var/www/html/storage/app/public

    # schedule:work corre en loop y dispara los comandos que estén
    # programados en el Schedule (todavía no hay ninguno agendado
    # -- ver notas de DEPLOY.md). Es inofensivo dejarlo corriendo
    # de una vez: si no hay nada agendado, simplemente no hace nada.
    command: php artisan schedule:work

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - colmerzia


  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile.prod
      args:
        APP_DIR: frontend
        VITE_API_URL: /api

    container_name: colmerzia_frontend
    restart: unless-stopped

    networks:
      - colmerzia


  storefront:
    build:
      context: .
      dockerfile: docker/node/Dockerfile.prod
      args:
        APP_DIR: storefront
        VITE_API_URL: /api

    container_name: colmerzia_storefront
    restart: unless-stopped

    networks:
      - colmerzia


  landing:
    build:
      context: .
      dockerfile: docker/node/Dockerfile.prod
      args:
        APP_DIR: landing
        VITE_ADMIN_URL: https://admin.colmerzia.com

    container_name: colmerzia_landing
    restart: unless-stopped

    networks:
      - colmerzia


  nginx:
    image: nginx:1.28-alpine
    container_name: colmerzia_nginx
    restart: unless-stopped

    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Certbot deja los certificados acá por convención. Ver
      # DEPLOY.md para cómo generarlos (wildcard, DNS-01).
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot

    ports:
      - "80:80"
      - "443:443"

    depends_on:
      - backend-web
      - frontend
      - storefront
      - landing

    networks:
      - colmerzia


volumes:
  postgres_data:
  redis_data:
  backend_storage:
  certbot_webroot:


networks:
  colmerzia:
    driver: bridge

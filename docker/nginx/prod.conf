# =============================================================
# Reverse-proxy PÚBLICO de producción. Es el único contenedor
# que recibe tráfico de internet (puertos 80/443); todo lo demás
# (backend, frontend, storefront, landing) vive en la red interna
# de Docker Compose, sin puertos expuestos al host.
#
# Un solo certificado wildcard cubre TODO lo de acá abajo:
#   dominios: colmerzia.com  *.colmerzia.com
# porque *.colmerzia.com ya cubre admin.colmerzia.com, 
# www.colmerzia.com y cualquier {tienda}.colmerzia.com futura —
# no hace falta un cert por tienda.
#
# Certbot con validación DNS-01 (no HTTP-01) es obligatorio acá,
# porque un wildcard NO se puede validar por HTTP-01. Eso requiere
# acceso por API a tu proveedor de DNS (ej. plugin de Cloudflare
# para certbot). Todavía no sabemos qué proveedor de DNS usan —
# hasta confirmarlo, dejamos las rutas de los certificados
# apuntando a donde Certbot los deja por convención
# (/etc/letsencrypt/live/colmerzia.com/...), montadas como volumen
# de solo lectura.
# =============================================================

# Redirige TODO el tráfico HTTP a HTTPS.
server {
    listen 80;
    server_name colmerzia.com www.colmerzia.com admin.colmerzia.com *.colmerzia.com;

    # Excepción: el challenge de Certbot (si en algún momento se usa
    # HTTP-01 para algún dominio puntual) necesita responder por HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ---- colmerzia.com / www.colmerzia.com -> landing ----
server {
    listen 443 ssl;
    http2 on;
    server_name colmerzia.com www.colmerzia.com;

    ssl_certificate     /etc/letsencrypt/live/colmerzia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/colmerzia.com/privkey.pem;

    location / {
        proxy_pass http://landing:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# ---- admin.colmerzia.com -> panel administrativo ----
server {
    listen 443 ssl;
    http2 on;
    server_name admin.colmerzia.com;

    ssl_certificate     /etc/letsencrypt/live/colmerzia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/colmerzia.com/privkey.pem;

    # Mismo origen para el panel y su API: el frontend admin llama a
    # VITE_API_URL=/api (relativo), así que /api en ESTE dominio
    # tiene que llegar al backend. Same-origin también evita tener
    # que configurar CORS (config/cors.php) para un dominio aparte
    # tipo api.colmerzia.com.
    location /api {
        proxy_pass http://backend-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos subidos (logo de la tienda, etc). APP_URL en
    # .env.production apunta a este mismo dominio
    # (https://admin.colmerzia.com), así que Storage::url() genera
    # enlaces tipo https://admin.colmerzia.com/storage/... — por eso
    # este dominio, y no los de cada tienda, es el que sirve /storage.
    location /storage/ {
        proxy_pass http://backend-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# ---- *.colmerzia.com -> storefront de cada tienda ----
#
# Wildcard: CUALQUIER subdominio que no matcheó exacto arriba (ni
# colmerzia.com/www ni admin.colmerzia.com) cae acá. nginx prioriza
# matches exactos de server_name sobre wildcards sin importar el
# orden en el archivo, así que esto es seguro tal como está.
#
# El Host real (ej. lecmarc.colmerzia.com) viaja intacto en el
# header Host de la petición proxy-eada — así el backend puede
# resolver el tenant por subdominio (TenantResolver, método 2)
# exactamente igual que en desarrollo.
server {
    listen 443 ssl;
    http2 on;
    server_name *.colmerzia.com;

    ssl_certificate     /etc/letsencrypt/live/colmerzia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/colmerzia.com/privkey.pem;

    location /api {
        proxy_pass http://backend-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://storefront:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

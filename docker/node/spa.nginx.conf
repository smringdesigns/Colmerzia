server {

    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA: cualquier ruta que no sea un archivo real cae en
    # index.html y React Router (o los <a href> internos) resuelven
    # la navegación del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre (los que genera Vite en
    # /assets) pueden cachearse agresivamente: si cambian, cambia el
    # nombre del archivo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

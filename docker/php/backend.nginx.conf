server {

    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # "backend" es el nombre del servicio php-fpm en
        # docker-compose.prod.yml — DNS interno de Docker Compose.
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Archivos subidos (logos, etc). OJO: acá NO usamos el symlink
    # public/storage -> storage/app/public que crea
    # `php artisan storage:link` — ese symlink no sobrevive un build
    # multi-stage de Docker (la etapa "web" no tiene storage/ copiado
    # adentro, así que apuntaría a un destino que no existe). En vez
    # de eso, servimos storage/app/public directo con un alias, que
    # es donde docker-compose.prod.yml monta el volumen
    # backend_storage tanto en "backend" como acá. La URL pública
    # sigue siendo la misma (/storage/...) porque
    # config/filesystems.php ya arma las URLs del disco "public" así
    # -- Storage::url() no cambia, esto es puro nginx.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
